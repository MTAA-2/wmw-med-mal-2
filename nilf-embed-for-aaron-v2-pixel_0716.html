  1. On the lander page (/), find the form embed you pasted this morning: the Custom HTML block
     with the <script>…</script> that loads forms.mtaa.ai.
  2. Replace that whole block with everything from <script> to </script> below. Paste it in the
     same spot. Remove the old block; don't keep both.
  3. Keep the page's own Facebook pixel and the geo.mtaa.ai/block.js script exactly as they are.
     This code fires the lander's own pixel (1892970894327129), so the pixel must stay on the page.
  4. Publish the Unbounce page.
  5. Check it: open the lander in a NEW private/incognito window and click through to the contact

  What it does: when someone submits, the lander's pixel fires "Lead", plus "QualifiedLead" if they

<script>
(function () {
  "use strict";
  var config = {"url":"https://forms.mtaa.ai/f/nf_ed86994ac1e34bae8a4cea4ebc0a4b03?embed=1","formId":1,"title":"Free Case Review"};
  var script = document.currentScript;
  if (!script || !script.parentNode) return;
  var url = new URL(config.url);
  var origin = url.origin;
  url.searchParams.set("parentOrigin", window.location.origin);
  var frame = document.createElement("iframe");
  frame.src = url.toString();
  frame.title = config.title;
  frame.loading = "lazy";
  frame.width = "100%";
  frame.height = "720";
  frame.style.border = "0";
  frame.style.display = "block";
  frame.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
  var session = null;
  var submitted = false;
  function cleanUrl(value) {
    try {
      var parsed = new URL(value);
      if (parsed.protocol !== "https:" && parsed.protocol !== "http:") return null;
      var clean = parsed.origin + parsed.pathname;
      return clean.length <= 2048 ? clean : null;
    } catch (_) { return null; }
  }
  // One id for this page session, reused by the browser event and by the
  // server's Conversions API copy of it. A UUID when the browser can make one,
  // 32 random hex characters when it only has getRandomValues, and a
  // Math.random string on the oldest browsers: an id that is merely unlikely to
  // repeat still beats no event at all.
  function eventBase() {
    var api = window.crypto;
    try {
      if (api && typeof api.randomUUID === "function") {
        var uuid = api.randomUUID();
        if (typeof uuid === "string" && /^[A-Za-z0-9-]{8,64}$/.test(uuid)) return uuid;
      }
      if (api && typeof api.getRandomValues === "function" && typeof Uint8Array === "function") {
        var bytes = api.getRandomValues(new Uint8Array(16));
        var hex = "";
        for (var index = 0; index < bytes.length; index += 1) hex += (bytes[index] + 256).toString(16).slice(-2);
        if (/^[a-f0-9]{32}$/.test(hex)) return hex;
      }
    } catch (_) { /* fall through to the arithmetic fallback */ }
    var random = "";
    while (random.length < 32) random += ("0000000" + Math.floor(Math.random() * 4294967296).toString(16)).slice(-8);
    return random.slice(0, 32);
  }
  function cookieValue(name) {
    // A hardened host page can make cookie access throw outright. The lead
    // still has to be reported, just without Meta's own cookies.
    var jar = "";
    try { jar = typeof document.cookie === "string" ? document.cookie : ""; } catch (_) { jar = ""; }
    var parts = jar.split(";");
    for (var index = 0; index < parts.length; index += 1) {
      var separator = parts[index].indexOf("=");
      if (separator < 1 || parts[index].slice(0, separator).trim() !== name) continue;
      var value = parts[index].slice(separator + 1).trim();
      return value.length > 0 && value.length <= 512 ? value : null;
    }
    return null;
  }
  // Meta's own click cookie when it exists; otherwise the one the pixel would
  // have written for this click, in the same format and timestamped now.
  function clickCookie(landing) {
    var stored = cookieValue("_fbc");
    if (stored) return stored;
    var clickId = landing.searchParams.get("fbclid");
    if (!clickId) return null;
    var built = "fb.1." + Date.now() + "." + clickId;
    return built.length <= 512 ? built : null;
  }
  var eventId = eventBase();
  function attribution() {
    var result = {};
    var landing = new URL(window.location.href);
    var clean = cleanUrl(landing.href);
    if (clean) result.landingUrl = clean;
    var referrer = cleanUrl(document.referrer);
    if (referrer) result.referrer = referrer;
    ["source", "medium", "campaign", "term", "content"].forEach(function (key) {
      var value = landing.searchParams.get("utm_" + key);
      if (value && value.length <= 2048) result[key] = value;
    });
    // The pixel carriers travel as ordinary click ids: the event id this page
    // will report, Meta's two browser cookies, and the compliance block flag.
    // They go in FIRST: the iframe runtime keeps only the first twenty click
    // ids, and these four are the ones that must never be the entries dropped.
    var clicks = {};
    clicks.mtaa_eid = eventId;
    var browserId = cookieValue("_fbp");
    if (browserId) clicks.fbp = browserId;
    var clickId = clickCookie(landing);
    if (clickId) clicks.fbc = clickId;
    if (window.__MTAA_PIXEL_BLOCKED === true) clicks.mtaa_pixel_blocked = "1";
    // The last six are Facebook's campaign, adset and ad ids in both spellings
    // the ad templates use. An Unbounce page carries them as hidden inputs; a
    // native form has none, so the landing URL is the only place they exist and
    // the lead's source_campaign/adset/ad columns stay empty without them.
    ["gclid", "fbclid", "msclkid", "cid", "campaign_id", "asid", "adset_id", "aid", "ad_id"].forEach(function (key) {
      var value = landing.searchParams.get(key);
      if (value && value.length <= 512) clicks[key] = value;
    });
    if (Object.keys(clicks).length) result.clickIds = clicks;
    return result;
  }
  function trackLead(outcome) {
    if (window.__MTAA_PIXEL_BLOCKED === true || typeof window.fbq !== "function") return;
    try {
      window.fbq("track", "Lead", {}, { eventID: eventId });
      if (outcome === "fql") window.fbq("trackCustom", "QualifiedLead", {}, { eventID: eventId + "_q" });
    } catch (_) {
      // A broken host pixel must never reach the lander or the form.
    }
  }
  window.addEventListener("message", function (event) {
    if (event.origin !== origin || event.source !== frame.contentWindow) return;
    var data = event.data;
    if (!data || typeof data !== "object" || Array.isArray(data) || data.formId !== config.formId) return;
    if (data.type === "mtaa-form:ready") {
      if (Object.keys(data).length !== 3 || typeof data.sessionId !== "string"
        || !/^[A-Za-z0-9_-]{8,128}$/.test(data.sessionId)) return;
      session = data.sessionId;
      frame.contentWindow.postMessage({ type: "mtaa-form:attribution", sessionId: session, attribution: attribution() }, origin);
    } else if (data.type === "mtaa-form:resize") {
      if (Object.keys(data).length !== 4 || !session || data.sessionId !== session
        || typeof data.height !== "number" || !Number.isFinite(data.height) || data.height <= 0) return;
      frame.height = String(Math.min(10000, Math.max(320, Math.ceil(data.height))));
    } else if (data.type === "mtaa-form:submitted") {
      if (Object.keys(data).length !== 4 || !session || data.sessionId !== session || submitted
        || (data.outcome !== "fql" && data.outcome !== "valid_non_fql")) return;
      submitted = true;
      trackLead(data.outcome);
    }
  });
  script.parentNode.insertBefore(frame, script);
})();
</script>
